# Site 100 % statique : aucune base de données, aucun espace d'administration, aucun code serveur.
[build]
  publish = "."

# En-têtes de sécurité envoyés avec chaque page
[[headers]]
  for = "/*"
  [headers.values]
    # N'autorise que les fichiers du site + les lecteurs Spotify / YouTube / Apple Music / Deezer
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://i.ytimg.com; frame-src https://open.spotify.com https://www.youtube-nocookie.com https://embed.music.apple.com https://widget.deezer.com; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    # Force le HTTPS pendant 2 ans
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Empêche l'affichage du site dans une page piégée (clickjacking)
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Ces fichiers de travail ne doivent jamais être servis
[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
